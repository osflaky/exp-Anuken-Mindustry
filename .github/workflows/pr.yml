name: Pull Request Tests

on:
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  testPR:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          java: 17
          arch: arm64
          runner: windows-11-arm
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
        # Arc ships no Windows ARM64 natives (arc64.dll is x64-only) and Temurin has no Windows aarch64 JDK 17,
        # so use an x64 JDK on Windows ARM, which runs under the OS's built-in x64 emulation
        architecture: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && 'x64' || (matrix.arch == 'arm64' && 'aarch64' || 'x64') }}
    - name: Fetch latest Arc
      run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc 
        ../Arc
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Run unit tests
      run: ./gradlew tests:test --stacktrace --rerun
    - name: Run unit tests and build JAR
      run: ./gradlew desktop:dist
    - name: Upload desktop JAR for testing
      uses: actions/upload-artifact@v7
      with:
        name: Desktop JAR
        archive: false
        path: desktop/build/libs/Mindustry.jar
