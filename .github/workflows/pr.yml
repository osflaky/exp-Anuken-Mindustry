name: Pull Request Tests

on:
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  testPR:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          java: 17
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-17-arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
        # Arc ships only an x64 arc64.dll for Windows (no Windows aarch64 native), and Temurin has no
        # Windows aarch64 JDK 17. Use the x64 JDK there; Windows 11 on ARM runs it under x64 emulation.
        architecture: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && 'x64' || '' }}
    - name: Fetch latest Arc
      run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc 
        ../Arc
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Run unit tests
      run: ./gradlew tests:test --stacktrace --rerun
    - name: Run unit tests and build JAR
      run: ./gradlew desktop:dist
    - name: Upload desktop JAR for testing
      uses: actions/upload-artifact@v7
      with:
        name: Desktop JAR
        archive: false
        path: desktop/build/libs/Mindustry.jar
    name: testPR [${{ matrix.expander_leg }}]
    timeout-minutes: 150
